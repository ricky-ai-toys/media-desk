# Media Desk source catalog.
# kind: yt_playlist | rss
# yt_playlist entries produce full transcripts; rss entries produce article
# headline/summary items (framing + coverage only, no quotes).
# Add a source here without touching code — adapters are generic.
#
# yt_playlist per-source keys:
#   title_regex:  rows whose title matches are ingest candidates (".+" = all).
#   content:      "clips" marks the show label "(segment clips)" and lets
#                 min_transcript_words be per-source (lower bar for segments).
#   scan_limit:   how many playlist rows to scan per run (default 30). Clip
#                 playlists post many undated segments daily — a low limit
#                 saturates and silently starves the back half of the window.
#   proxy_url:    per-source proxy (e.g. "http://host:port") for playlists
#                 country-locked against this egress; else set fetch.proxy_url
#                 globally. Applied to yt-dlp playlist scan, date probes,
#                 and caption downloads.
#
# Dates: rows whose flat-playlist upload_date comes back NA and whose title
# carries no date get resolved by a batched single-video probe, capped at
# fetch.max_date_probes per run (oldest pending first; the rest are logged
# as "probe-deferred" and retried next run).

sources:
  - id: bloomberg_asia_trade
    name: "The Asia Trade"
    outlet: "Bloomberg Asia TV"
    kind: yt_playlist
    playlist_id: "PLGaYlBJIOoa8zJLXejV8ZIXJydxAMu-kW"
    playlist_url: "https://www.youtube.com/playlist?list=PLGaYlBJIOoa8zJLXejV8ZIXJydxAMu-kW"
    title_regex: ".+"
    content: clips
    min_transcript_words: 200
    scan_limit: 100
    enabled: true
    note: "Clip-mode since 2026-09-19: dated full episodes no longer uploaded after 9/9/2026; playlist still carries daily undated clips (EN manual captions verified on server 2026-09-19). Episodes surface as 'The Asia Trade (segment clips)'."

  - id: bloomberg_china_show
    name: "The China Show"
    outlet: "Bloomberg Asia TV"
    kind: yt_playlist
    playlist_id: "PLGaYlBJIOoa94hnb-z2i64eVPcGZPUvo9"
    playlist_url: "https://www.youtube.com/playlist?list=PLGaYlBJIOoa94hnb-z2i64eVPcGZPUvo9"
    title_regex: ".+"
    content: clips
    min_transcript_words: 200
    scan_limit: 100
    enabled: true
    note: "Clip-mode since 2026-09-19: dated full episodes no longer uploaded after 9/8/2026; daily undated clips verified (EN manual captions, server 2026-09-19). Episodes surface as 'The China Show (segment clips)'."

  - id: bloomberg_insight
    name: "Insight with Haslinda Amin"
    outlet: "Bloomberg Asia TV"
    kind: yt_playlist
    playlist_id: "PLGaYlBJIOoa_6-KXq8HBmOQcs62Qfvdv2"
    playlist_url: "https://www.youtube.com/playlist?list=PLGaYlBJIOoa_6-KXq8HBmOQcs62Qfvdv2"
    title_regex: ".+"
    content: clips
    min_transcript_words: 200
    scan_limit: 100
    enabled: true
    note: "Clip-mode since 2026-09-19: dated full episodes no longer uploaded after 9/8/2026; daily undated clips verified (EN manual captions, server 2026-09-19). Episodes surface as 'Insight with Haslinda Amin (segment clips)'."

  - id: cnbc_wire
    name: "CNBC Markets"
    outlet: "CNBC"
    kind: rss
    feed_url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"
    enabled: true

  - id: cnbc_squawk_box_asia
    name: "Squawk Box Asia"
    outlet: "CNBC Asia"
    kind: yt_playlist
    playlist_id: "PLJ8IrgLlRTdjdGD49CigFMtJYdduEUsf1"
    # Official channel playlist carries segment clips (analyst interviews),
    # not full episodes — clip titles carry no show name, so match all rows.
    # Episodes surface as "Squawk Box Asia (segment clips)" in the sample frame.
    playlist_url: "https://www.youtube.com/playlist?list=PLJ8IrgLlRTdjdGD49CigFMtJYdduEUsf1"
    title_regex: ".+"
    content: clips
    min_transcript_words: 200
    scan_limit: 100
    enabled: true
    note: "Clip-mode source (GO 2026-08-23: 10/10 playlist matches, EN auto-captions ~1.6k words/clip). Episodes surface as 'Squawk Box Asia (segment clips)' in the sample frame."

  # cnbc_china_connection / cnbc_street_signs_asia retired 2026-09: CNBC closed
  # its Hong Kong bureau (2026-09-03) and cancelled these daily live shows;
  # neither was ever enabled or ingested.

  - id: cnbc_squawk_box_us
    name: "Squawk Box (US)"
    outlet: "CNBC"
    kind: yt_playlist
    playlist_id: "PLVbP054jv0KptiGrqXv0nlwHjV9EqOptT"
    playlist_url: "https://www.youtube.com/playlist?list=PLVbP054jv0KptiGrqXv0nlwHjV9EqOptT"
    title_regex: ".+"
    content: clips
    min_transcript_words: 200
    scan_limit: 100
    enabled: true
    note: "GO 2026-09-19 (verify_sources): 10/10 playlist matches, date via probe, EN auto-captions ~1.4k words/clip; CNBC Television US Squawk Box clips, not geo-blocked from HK egress."

  # CNBC 'Watch In Full' full-episode playlists (e.g. Squawk Box Asia
  # PLJ8IrgLlRTdiFCPPEbWpKaNnWCzRsV-sd, updated daily to 17-Sep-26) are
  # uploader country-locked and unreachable from this HK egress — add a
  # proxy_url (SG/JP/US exit) and run verify_sources before enabling.

  - id: scmp_china
