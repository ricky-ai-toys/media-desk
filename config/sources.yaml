fetch:
  lookback_days: 7
  min_transcript_words: 500
  transcript_dir: "/home/rickyubuntu/workspace/media-desk/data/transcripts"
  use_auto_subs_fallback: true
  max_date_probes: 15
  # A weekly TV feed that hasn't landed an episode in 4 days is broken or
  # cancelled — 10 days hid the September starvation for a whole week.
  stale_days: 4

analysis:
  model: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com/v1"
  api_key_env: "DEEPSEEK_API_KEY"
  temperature: 0.2
  chunk_words: 2000

db:
  path: "/home/rickyubuntu/workspace/media-desk/data/media.db"

v5:
  raw_root: "/home/rickyubuntu/workspace/yt-weekly/raw"
  analysis_root: "/home/rickyubuntu/workspace/yt-weekly/analysis"
  editions_root: "/home/rickyubuntu/workspace/yt-weekly/burson-weekly"
  skill_root: "/home/rickyubuntu/.hermes/skills/burson-international-financial-media-weekly"

web:
  port: 8517
  public_read_only: true
  admin_token_env: "MEDIA_DESK_ADMIN_TOKEN"
  cors_origins:
    - "http://localhost:8517"
    - "http://127.0.0.1:8517"
    - "https://media.ricky.study:8443"
